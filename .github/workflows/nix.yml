name: Nix CI

on:
  push:
    branches: [ "nixos-package" ]
  pull_request:
    branches: [ "nixos-package" ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build pdf2htmlEX Flake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc
        with:
          name: pdf2htmlex-nixos # Replace with your cache name
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          
      - name: Verify Flake Checker
        uses: DeterminateSystems/flake-checker-action@078f5f7f47ee188aa6cb472527ca5984e195222d
        
      - name: Build pdf2htmlEX
        run: nix build .#pdf2htmlEX --print-build-logs

      - name: Smoke Test Binary
        run: ./result/bin/pdf2htmlEX -v
